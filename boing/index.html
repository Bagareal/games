<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Boing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="loadingScreen">
    <div class="emoji">⚡</div>
    <div style="font-size:22px; font-weight:800;">Boing</div>
    <div class="spinner"></div>
  </div>

  <div class="topbar">
    <div class="icon-group">
      <a class="icon-btn" href="../" aria-label="Home">🏠</a>
      <button class="icon-btn" id="langBtn" aria-label="Lingua">🌍</button>
    </div>
    <div class="level-display"><span class="lv-label" data-i18n="levelLabel">Livello</span> <span id="levelValue">1</span></div>
    <div class="lives" id="livesDisplay"></div>
  </div>
  <div class="score-row"><span data-i18n="scoreLabel">Punteggio</span>: <span id="scoreValue">0</span></div>

  <div class="game-zone">
    <canvas id="gameCanvas" width="180" height="270"></canvas>
    <div class="tap-hint hidden" id="tapHint" data-i18n="tapToLaunch">Tocca per lanciare la pallina</div>
  </div>

  <div class="overlay show" id="difficultyOverlay">
    <div class="card">
      <div class="crown-icon">⚡</div>
      <h2 data-i18n="chooseDifficulty">Scegli la difficoltà</h2>
      <p data-i18n="chooseDifficultySub">Puoi cambiarla ogni volta che inizi una partita</p>
      <div class="difficulty-list">
        <button class="difficulty-option" data-difficulty="easy" data-i18n="easy">Facile</button>
        <button class="difficulty-option" data-difficulty="medium" data-i18n="medium">Medio</button>
        <button class="difficulty-option" data-difficulty="hard" data-i18n="hard">Difficile</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="levelCompleteOverlay">
    <div class="card">
      <div class="crown-icon">🏆</div>
      <h2 data-i18n="levelComplete">Livello Completato!</h2>
      <p id="levelCompleteSub"></p>
      <button class="primary-btn" id="nextLevelBtn" data-i18n="continueBtn">Continua →</button>
    </div>
  </div>

  <div class="overlay" id="gameOverOverlay">
    <div class="card">
      <div class="crown-icon">💥</div>
      <h2 data-i18n="gameOver">Game Over</h2>
      <p id="gameOverSub"></p>
      <button class="primary-btn" id="retryBtn" data-i18n="playAgain">Rigioca</button>
    </div>
  </div>

  <div class="overlay" id="languageOverlay">
    <div class="card">
      <h2 data-i18n="languageTitle">🌍 Lingua</h2>
      <p data-i18n="languageSub">Scegli la lingua dell'interfaccia</p>
      <div class="language-list" id="languageList"></div>
      <button class="secondary-btn" id="closeLanguageBtn" data-i18n="close">Chiudi</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
